openapi: 3.1.0
info:
  title: Kitchen Order Service Api
  description: |-
    API for managing the kitchen workflow. This service handles order processing, 
    cooking status updates, and kitchen-specific order filtering.
  version: 1.0.0
  contact:
    name: Alexander Pilipuk
    email: sashapilipuk@yandex.by
servers:
  - url: 'http://localhost:8081'

paths:
  /orders:
    post:
      tags:
        - Kitchen
      summary: Get all kitchen orders with filter criteria
      description: Returns a list of kitchen orders filtered by the provided criteria such as IDs, OrderIDs, statuses, or specific item names
      operationId: findOrders
      requestBody:
        description: The search criteria
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderDto'
        '400':
          description: Invalid request body or filter parameters
        '500':
          description: Internal server error

  /orders/{id}:
    get:
      tags:
        - Kitchen
      summary: Get kitchen order by id
      description: Retrieve detailed information about a specific kitchen order
      operationId: findById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDto'
        '404':
          description: Kitchen Order with the specified ID not found

components:
  schemas:

    OrderDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Internal kitchen primary key
          example: 1
        orderId:
          type: integer
          format: int64
          description: External ID from the order-service
          example: 1
        status:
          type: string
          example: "COOKING"
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemsDto'

    OrderItemsDto:
      type: object
      required:
        - itemName
      properties:
        id:
          type: integer
          format: int64
          example: 1
        OrderId:
          type: integer
          format: int64
          description: Reference to the kitchen order ID
          example: 1
        itemName:
          type: string
          nullable: false
          example: "Pizza"
        cooked:
          type: boolean
          description: Indicates if this specific item has finished cooking
          example: false

    OrderRequestDto:
      description: Request dto provided in the request body to filter orders
      type: object
      properties:
        id:
          type: array
          description: Filter by a list of kitchen order IDs
          nullable: true
          items:
            type: integer
            format: int64
          example: [1, 2, 3]
        orderId:
          type: array
          description: Filter by orderId
          nullable: true
          items:
            type: integer
            format: int64
          example: [1, 2, 3]
        status:
          type: array
          description: Filter by status
          nullable: true
          items:
            type: string
          example: ["ACCEPTED", "COOKING"]
        items:
          type: array
          description: Filter by itemName
          nullable: true
          items:
            type: string
          example: ["Pizza", "Burger"]